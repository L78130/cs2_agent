<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>demo_coach</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1c2330; --border: #2d333b;
    --text: #e6edf3; --dim: #8b949e; --accent: #f0a500;
    --t: #e8b23a; --ct: #4aa3ff; --red: #ff5252;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif; height: 100vh;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 1rem; padding: .6rem 1.2rem;
    border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h1 { font-size: 1.05rem; margin: 0; letter-spacing: .12em; font-weight: 600; }
  header h1 span { color: var(--accent); }
  main { flex: 1; display: flex; min-height: 0; }

  #sidebar {
    width: 220px; border-right: 1px solid var(--border); background: var(--panel);
    padding: 1rem; display: flex; flex-direction: column; gap: .8rem;
  }
  .btn {
    background: var(--accent); color: #111; border: none; border-radius: 6px;
    padding: .55rem 1rem; font-weight: 600; cursor: pointer; font-size: .9rem;
  }
  .btn:disabled { opacity: .5; cursor: default; }
  .match-item {
    padding: .6rem .7rem; border-radius: 6px; background: var(--panel2);
    border: 1px solid var(--border); cursor: pointer; font-size: .85rem;
  }
  .match-item.active { border-color: var(--accent); }
  .match-item .sub { color: var(--dim); font-size: .75rem; margin-top: .2rem; }

  #center { flex: 1; display: flex; flex-direction: column; min-width: 0; padding: 1rem; }
  #rounds { display: flex; flex-wrap: wrap; gap: .3rem; margin-bottom: .8rem; min-height: 2rem; }
  .rnd {
    min-width: 2rem; padding: .25rem .4rem; text-align: center; border-radius: 5px;
    background: var(--panel2); border: 1px solid var(--border); cursor: pointer;
    font-size: .78rem; color: var(--dim);
  }
  .rnd.t { border-bottom: 3px solid var(--t); }
  .rnd.ct { border-bottom: 3px solid var(--ct); }
  .rnd.active { background: var(--accent); color: #111; font-weight: 700; }
  #radar-wrap {
    flex: 1; display: flex; align-items: center; justify-content: center;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    min-height: 0; position: relative;
  }
  #radar { max-width: 100%; max-height: 100%; border-radius: 8px; }
  #radar-empty { color: var(--dim); font-size: .9rem; position: absolute; }
  #feed {
    position: absolute; top: 10px; right: 10px; display: flex;
    flex-direction: column; gap: 4px; align-items: flex-end; pointer-events: none;
  }
  .feed-row {
    background: rgba(13,17,23,.85); border: 1px solid var(--border);
    border-radius: 4px; padding: 2px 8px; font-size: .78rem;
    display: flex; gap: .4rem; align-items: center;
  }
  .feed-row img { height: 12px; }
  .feed-row .hs { color: var(--red); font-weight: 700; }

  #right {
    width: 400px; border-left: 1px solid var(--border); background: var(--panel);
    display: flex; flex-direction: column;
  }
  #tabs { display: flex; border-bottom: 1px solid var(--border); }
  .tab {
    flex: 1; padding: .65rem; text-align: center; cursor: pointer; color: var(--dim);
    font-size: .85rem; border-bottom: 2px solid transparent;
  }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .pane { flex: 1; overflow-y: auto; padding: .8rem; display: none; min-height: 0; }
  .pane.active { display: flex; flex-direction: column; }

  table { border-collapse: collapse; width: 100%; font-size: .8rem; }
  th, td { padding: .35rem .4rem; text-align: right; border-bottom: 1px solid var(--border); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--dim); font-weight: 500; position: sticky; top: 0; background: var(--panel); }

  #chatlog { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: .6rem; }
  .msg { padding: .55rem .7rem; border-radius: 8px; font-size: .85rem; white-space: pre-wrap; line-height: 1.45; }
  .msg.user { background: #1f3a5f; align-self: flex-end; max-width: 90%; }
  .msg.bot { background: var(--panel2); align-self: flex-start; max-width: 95%; }
  #chatbar { display: flex; gap: .5rem; padding-top: .6rem; }
  #chatbar input {
    flex: 1; background: var(--panel2); border: 1px solid var(--border);
    border-radius: 6px; padding: .55rem .7rem; color: var(--text); font-size: .85rem;
  }
  #chatbar input:focus { outline: none; border-color: var(--accent); }

  #overlay {
    position: fixed; inset: 0; background: rgba(13,17,23,.85); display: none;
    align-items: center; justify-content: center; flex-direction: column;
    gap: 1rem; z-index: 10;
  }
  #overlay.show { display: flex; }
  .bar { width: 320px; height: 6px; background: var(--panel2); border-radius: 3px; overflow: hidden; }
  .bar > div {
    height: 100%; width: 40%; background: var(--accent); border-radius: 3px;
    animation: slide 1.1s ease-in-out infinite;
  }
  @keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
  .spin {
    display: inline-block; width: .9em; height: .9em; border: 2px solid var(--dim);
    border-top-color: var(--accent); border-radius: 50%; animation: rot .7s linear infinite;
  }
  @keyframes rot { to { transform: rotate(360deg); } }
  .hint { color: var(--dim); font-size: .85rem; }
  #replay-bar { display: flex; gap: .6rem; align-items: center; margin-bottom: .6rem; }
  #replay-bar .btn.sm { padding: .3rem .7rem; font-size: .8rem; }
  #timeline-wrap { flex: 1; position: relative; }
  #timeline { width: 100%; accent-color: var(--accent); }
  #timeline-marks {
    position: absolute; top: -5px; left: 0; right: 0; height: 5px; pointer-events: none;
  }
  .tk { position: absolute; width: 3px; height: 6px; border-radius: 2px; background: var(--red); }
  #speed {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 5px; padding: .25rem;
  }
  #gear-strip {
    display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .5rem;
    justify-content: center;
  }
  .gear-card {
    background: var(--panel2); border: 1px solid var(--border); border-radius: 6px;
    padding: .3rem .5rem; font-size: .72rem; min-width: 6.5rem;
  }
  .gear-card .gname { font-weight: 600; font-size: .75rem; }
  .gear-card .gweapon { color: var(--accent); }
  .gear-card .ginv { color: var(--dim); }
  .gear-card.dead { opacity: .35; }
  .gear-card.t { border-top: 2px solid var(--t); }
  .gear-card.ct { border-top: 2px solid var(--ct); }
  .wicon { height: 13px; vertical-align: -2px; }
  .gear-card .gweapon .wicon { height: 17px; }
  .gear-card .ginv .wicon { height: 11px; opacity: .7; margin-right: 2px; }
</style>
</head>
<body>
<header><h1>demo<span>_coach</span></h1><span class="hint" id="hdr-status"></span></header>
<main>
  <div id="sidebar">
    <input type="file" id="file" accept=".dem" hidden>
    <button class="btn" id="upload-btn" onclick="document.getElementById('file').click()">Upload .dem</button>
    <div id="match-list"></div>
  </div>

  <div id="center">
    <div id="rounds"></div>
    <div id="replay-bar" hidden>
      <button class="btn sm" id="play-btn" onclick="togglePlay()">▶ Replay</button>
      <div id="timeline-wrap">
        <div id="timeline-marks"></div>
        <input type="range" id="timeline" min="0" max="100" value="0" step="any" disabled>
      </div>
      <select id="speed" disabled><option value="1">1x</option><option value="2">2x</option><option value="4">4x</option></select>
      <span id="clock" class="hint"></span>
    </div>
    <div id="radar-wrap">
      <canvas id="radar" width="1024" height="1024" hidden></canvas>
      <span id="radar-empty">upload a demo to see the 2D round map</span>
      <div id="feed"></div>
    </div>
    <div id="gear-strip"></div>
  </div>

  <div id="right">
    <div id="tabs">
      <div class="tab active" data-pane="scoreboard">Scoreboard</div>
      <div class="tab" data-pane="roundlog">Rounds</div>
      <div class="tab" data-pane="chat">Chat</div>
    </div>
    <div class="pane active" id="pane-scoreboard"></div>
    <div class="pane" id="pane-roundlog"></div>
    <div class="pane" id="pane-chat">
      <div id="chatlog"></div>
      <div id="chatbar">
        <input id="q" placeholder="Ask about the match..." onkeydown="if(event.key==='Enter')send()">
        <button class="btn" onclick="send()">Send</button>
      </div>
    </div>
  </div>
</main>

<div id="overlay">
  <div class="bar"><div></div></div>
  <span class="hint" id="overlay-text">parsing demo...</span>
</div>

<script>
let demoId = null, history = [], matches = {}, curRound = 0, mapData = null;
let replayData = null, playing = false, playTick = 0, lastFrame = 0;
let hoverables = [], hover = null;

const TICK_RATE = 64;
const $ = id => document.getElementById(id);
const overlay = (show, text) => {
  $("overlay").classList.toggle("show", show);
  if (text) $("overlay-text").textContent = text;
};

document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
  document.querySelectorAll(".pane").forEach(x => x.classList.remove("active"));
  t.classList.add("active");
  $("pane-" + t.dataset.pane).classList.add("active");
});

$("file").onchange = () => upload();
$("speed").onchange = e => { speed = parseFloat(e.target.value); };
let speed = 1;
$("timeline").oninput = e => {
  if (!replayData) return;
  playTick = parseFloat(e.target.value);
  for (const p of replayData.players) p._i = 0;
  render();
};

async function upload() {
  const f = $("file").files[0];
  if (!f) return;
  overlay(true, "uploading & parsing demo... (cached demos load instantly)");
  try {
    const fd = new FormData(); fd.append("file", f);
    const r = await fetch("/api/upload", { method: "POST", body: fd });
    const j = await r.json();
    if (!r.ok) { overlay(false); alert(j.detail); return; }
    await refreshMatches(j.demo_id);
  } finally { overlay(false); $("file").value = ""; }
}

async function refreshMatches(selectId) {
  const list = await (await fetch("/api/matches")).json();
  matches = Object.fromEntries(list.map(m => [m.demo_id, m]));
  $("match-list").innerHTML = "";
  for (const m of list) {
    const d = document.createElement("div");
    d.className = "match-item" + (m.demo_id === selectId ? " active" : "");
    d.innerHTML = `${m.map}<div class="sub">${m.rounds_played} rounds</div>`;
    d.onclick = () => selectMatch(m.demo_id);
    $("match-list").appendChild(d);
  }
  if (selectId) selectMatch(selectId);
}

async function toolQuery(id, name, args) {
  const r = await fetch(`/api/matches/${id}/tool/${name}`, {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify(args),
  });
  if (!r.ok) throw new Error((await r.json()).detail || r.status);
  return r.json();
}

async function selectMatch(id) {
  demoId = id; history = []; $("chatlog").innerHTML = "";
  const m = matches[id];
  $("hdr-status").textContent = `${m.map} — ${m.rounds_played} rounds`;
  overlay(true, "loading match data...");
  try {
    renderScoreboard(await toolQuery(id, "get_scoreboard", {}));
    renderRounds(m.rounds_played);
    await loadRound(0);
  } finally { overlay(false); }
}

function renderScoreboard(rows) {
  const cols = ["name","kills","deaths","assists","kd","adr","hs_pct","kast","first_kills"];
  const labels = ["player","K","D","A","K/D","ADR","HS%","KAST","1st"];
  let h = "<table><tr>" + labels.map(c => `<th>${c}</th>`).join("") + "</tr>";
  for (const r of rows)
    h += "<tr>" + cols.map(c => `<td>${r[c]}</td>`).join("") + "</tr>";
  $("pane-scoreboard").innerHTML = h + "</table>";
}

function renderRounds(n) {
  $("rounds").innerHTML = "";
  for (let i = 0; i < n; i++) {
    const b = document.createElement("div");
    b.className = "rnd"; b.id = "rnd-" + i; b.textContent = i + 1;
    b.onclick = () => loadRound(i);
    $("rounds").appendChild(b);
  }
  toolQuery(demoId, "get_rounds_log", {}).then(rows => {
    let h = "<table><tr><th>#</th><th>winner</th><th>reason</th><th>T buy</th><th>CT buy</th></tr>";
    for (const r of rows) {
      h += `<tr><td>${r.round + 1}</td><td style="color:${r.winner_side === "T" ? "var(--t)" : "var(--ct)"}">${r.winner_side}</td><td>${r.reason_text}</td><td>${r.t_buy}</td><td>${r.ct_buy}</td></tr>`;
      const btn = $("rnd-" + r.round);
      if (btn) btn.classList.add(r.winner_side === "T" ? "t" : "ct");
    }
    $("pane-roundlog").innerHTML = h + "</table>";
  }).catch(() => {});
}

// ---- radar rendering ----
// Single preloaded image + single render entry point: every paint is a full
// synchronous repaint (background first), so no async onload races.
const TEAM_COLOR = { 2: "#e8b23a", 3: "#4aa3ff" };
let radarImg = new Image(), radarImgReady = false;

// short weapon name -> Valve SVG slug under /static/icons/
// (icons extracted from CS2, via github.com/Juknum/counter-strike-icons)
const WEAPON_ICON = {
  "AK-47": "ak47", "AUG": "aug", "AWP": "awp", "PP-Bizon": "bizon",
  "C4": "c4", "CZ75-Auto": "cz75a", "Desert Eagle": "deagle",
  "Decoy": "decoy", "Kit": "defuser", "Dual Berettas": "elite",
  "FAMAS": "famas", "Five-SeveN": "fiveseven", "Flash": "flashbang",
  "G3SG1": "g3sg1", "Galil AR": "galilar", "Glock-18": "glock",
  "HE": "hegrenade", "P2000": "p2000", "Incendiary": "incgrenade",
  "Knife": "knife", "M249": "m249", "M4A4": "m4a1",
  "M4A1-S": "m4a1_silencer", "MAC-10": "mac10", "MAG-7": "mag7",
  "Molotov": "molotov", "MP5-SD": "mp5sd", "MP7": "mp7", "MP9": "mp9",
  "Negev": "negev", "Nova": "nova", "P250": "p250", "P90": "p90",
  "R8 Revolver": "revolver", "Sawed-Off": "sawedoff", "SCAR-20": "scar20",
  "SG 553": "sg556", "Smoke": "smokegrenade", "SSG 08": "ssg08",
  "Zeus x27": "taser", "Tec-9": "tec9", "UMP-45": "ump45",
  "USP-S": "usp_silencer", "XM1014": "xm1014",
};
const ICON_SLUGS = new Set(Object.values(WEAPON_ICON));
const iconCache = {};
function iconImg(slug) {
  let img = iconCache[slug];
  if (!img) {
    img = new Image();
    img.onload = () => render();
    img.src = `/static/icons/${slug}.svg`;
    iconCache[slug] = img;
  }
  return img.complete && img.naturalWidth ? img : null;
}
function iconTag(w) {
  const slug = WEAPON_ICON[w];
  return slug
    ? `<img class="wicon" src="/static/icons/${slug}.svg" title="${w}" alt="${w}">`
    : `<span>${w}</span>`;
}

let wallMask = null;  // binary wall mask of the current radar, for vision cones

function loadRadarImage(src) {
  radarImgReady = false; wallMask = null;
  radarImg = new Image();
  radarImg.onload = () => {
    radarImgReady = true;
    wallMask = extractWallMask(radarImg);
    render();
  };
  radarImg.src = src;
}

// ---- vision cones, ported from skkwowee/cs2-demo-viewer MapCanvas (MIT) ----
// Walls are alpha boundaries (opaque geometry vs transparent background) plus
// very dark opaque pixels (interior wall outlines).
const CONE_FOV = Math.PI / 2, CONE_WORLD = 1500, RAY_COUNT = 60, RAY_STEP = 2;

function extractWallMask(img) {
  const S = 1024;
  const off = document.createElement("canvas");
  off.width = off.height = S;
  const c2 = off.getContext("2d");
  c2.drawImage(img, 0, 0, S, S);
  const d = c2.getImageData(0, 0, S, S).data;
  const mask = new Uint8Array(S * S);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const i = y * S + x, o = i * 4, opaque = d[o + 3] >= 128;
    let boundary = false;
    if (x > 0 && (d[(i - 1) * 4 + 3] >= 128) !== opaque) boundary = true;
    else if (x < S - 1 && (d[(i + 1) * 4 + 3] >= 128) !== opaque) boundary = true;
    else if (y > 0 && (d[(i - S) * 4 + 3] >= 128) !== opaque) boundary = true;
    else if (y < S - 1 && (d[(i + S) * 4 + 3] >= 128) !== opaque) boundary = true;
    if (boundary) mask[i] = 1;
    else if (opaque && (d[o] + d[o + 1] + d[o + 2]) / 3 < 45) mask[i] = 1;
  }
  return mask;
}

function raycastCone(cx, cy, angleCenter, maxRadius) {
  const pts = [];
  for (let i = 0; i <= RAY_COUNT; i++) {
    const a = angleCenter - CONE_FOV / 2 + CONE_FOV * i / RAY_COUNT;
    const cosA = Math.cos(a), sinA = Math.sin(a);
    let dist = RAY_STEP, hit = maxRadius;
    while (dist <= maxRadius) {
      const sx = Math.round(cx + cosA * dist), sy = Math.round(cy + sinA * dist);
      if (sx < 0 || sx >= 1024 || sy < 0 || sy >= 1024 || wallMask[sy * 1024 + sx]) {
        hit = dist; break;
      }
      dist += RAY_STEP;
    }
    pts.push([cx + cosA * hit, cy + sinA * hit]);
  }
  return pts;
}

function drawCone(ctx, x, y, yawDeg, radius, color) {
  const angle = -yawDeg * Math.PI / 180;  // CS2 yaw -> canvas angle
  const r = parseInt(color.slice(1, 3), 16),
        g = parseInt(color.slice(3, 5), 16),
        b = parseInt(color.slice(5, 7), 16);
  const grad = ctx.createRadialGradient(x, y, 0, x, y, radius);
  const base = 0.12, e1 = Math.E - 1;
  for (const t of [0, 0.03, 0.08, 0.15, 0.25, 0.4, 0.6, 0.8, 1.0]) {
    const a = t === 0 ? base : base * Math.max(0, 1 - Math.log(1 + t * e1));
    grad.addColorStop(t, `rgba(${r},${g},${b},${a.toFixed(3)})`);
  }
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(x, y);
  for (const [px, py] of raycastCone(x, y, angle, radius)) ctx.lineTo(px, py);
  ctx.closePath();
  ctx.fill();
}

function radarCtx() {
  const c = $("radar");
  return [c, c.getContext("2d"), c.width / 1024];
}
function toPx(x, y, cal, k2) {
  return [(x - cal.pos_x) / cal.scale * k2, (cal.pos_y - y) / cal.scale * k2];
}
// keep markers fully inside the canvas — stale/off-map position samples
// would otherwise draw partial dots at the map edges
const clampPx = v => Math.min(Math.max(v, 8), 1016);
function drawKillMark(ctx, x, y, headshot) {
  ctx.strokeStyle = headshot ? "#ff5252" : "#f0a500"; ctx.lineWidth = 2.5;
  const s = 6;
  ctx.beginPath();
  ctx.moveTo(x - s, y - s); ctx.lineTo(x + s, y + s);
  ctx.moveTo(x + s, y - s); ctx.lineTo(x - s, y + s);
  ctx.stroke();
}
function drawTag(ctx, x, y, line1, line2, color) {
  // permanent name + weapon tag above a player marker;
  // line2 (weapon) is drawn as an SVG icon when one is loaded, text fallback
  const img = line2 && WEAPON_ICON[line2] ? iconImg(WEAPON_ICON[line2]) : null;
  ctx.font = "bold 12px system-ui";
  const w1 = ctx.measureText(line1).width;
  let w2 = 0;
  if (img) w2 = img.naturalWidth / img.naturalHeight * 10;
  else if (line2) { ctx.font = "10px system-ui"; w2 = ctx.measureText(line2).width; }
  const w = Math.max(w1, w2) + 10, h = line2 ? 30 : 17;
  const bx = Math.min(Math.max(x - w / 2, 2), 1024 - w - 2);
  const by = Math.max(y - h - 10, 2);
  ctx.fillStyle = "rgba(13,17,23,.78)";
  ctx.beginPath(); ctx.roundRect(bx, by, w, h, 4); ctx.fill();
  ctx.fillStyle = color;
  ctx.font = "bold 12px system-ui";
  ctx.fillText(line1, bx + 5, by + 13);
  if (img) {
    ctx.drawImage(img, bx + 5, by + 17, w2, 10);
  } else if (line2) {
    ctx.fillStyle = "#c9d1d9"; ctx.font = "10px system-ui";
    ctx.fillText(line2, bx + 5, by + 26);
  }
}
function drawHoverTooltip(ctx) {
  if (!hover) return;
  ctx.font = "13px system-ui";
  const w = ctx.measureText(hover.label).width + 12;
  const x = Math.min(Math.max(hover.x - w / 2, 2), 1024 - w - 2);
  const y = Math.max(hover.y - 26, 4);
  ctx.fillStyle = "rgba(13,17,23,.9)";
  ctx.strokeStyle = "#f0a500"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(x, y, w, 20, 4); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#e6edf3";
  ctx.fillText(hover.label, x + 6, y + 14);
}

// THE single paint entry point
function render() {
  if (!radarImgReady) return;
  const [c, ctx, k2] = radarCtx();
  c.hidden = false; $("radar-empty").style.display = "none";
  // clearRect first: the radar PNG has large transparent areas, and drawImage
  // only composites — without clearing, tags/markers on those pixels persist
  // as smudges from previous frames
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.drawImage(radarImg, 0, 0, c.width, c.height);
  hoverables = [];
  if (replayData) renderReplayScene(ctx, k2); else renderStaticScene(ctx, k2);
}

function renderStaticScene(ctx, k2) {
  for (const k of mapData.kills) {
    let [ax, ay] = toPx(k.attacker_x, k.attacker_y, mapData.calibration, k2);
    let [vx, vy] = toPx(k.victim_x, k.victim_y, mapData.calibration, k2);
    ax = clampPx(ax); ay = clampPx(ay); vx = clampPx(vx); vy = clampPx(vy);
    ctx.strokeStyle = "rgba(239,68,68,.8)"; ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(vx, vy); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = "#4aa3ff";
    ctx.beginPath(); ctx.arc(ax, ay, 4, 0, 7); ctx.fill();
    drawKillMark(ctx, vx, vy, k.headshot);
    hoverables.push({ x: ax, y: ay, label: k.attacker + " (attacker)" });
    hoverables.push({ x: vx, y: vy, label: k.victim + " — " + k.weapon + (k.headshot ? " ◉" : "") });
  }
  drawHoverTooltip(ctx);
}

function renderReplayScene(ctx, k2) {
  const cal = replayData.calibration;
  const teamOf = {};
  for (const p of replayData.players) teamOf[p.name] = p.team;
  // shot tracers: fade out over ~0.35s of game time; direction from shooter yaw
  // (CS2 demos do not record bullet impact points, so this is an approximation)
  for (const f of replayData.fires || []) {
    const dt = playTick - f.tick;
    if (dt < 0 || dt > 22 || f.x === null) continue;
    const [sx, sy] = toPx(f.x, f.y, cal, k2);
    const rad = -f.yaw * Math.PI / 180;
    const len = 400 / cal.scale * k2;  // ~400 world units, like cs2-demo-viewer
    ctx.globalAlpha = 0.6 * (1 - dt / 22);
    ctx.strokeStyle = "#ffd97a"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(sx, sy);
    ctx.lineTo(sx + Math.cos(rad) * len, sy + Math.sin(rad) * len);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // damage lines: recent hits, attacker -> victim, alpha scaled by dmg
  for (const d of replayData.damages || []) {
    const dt = playTick - d.tick;
    if (dt < 0 || dt > 48) continue;
    const [ax, ay] = toPx(d.attacker_x, d.attacker_y, cal, k2);
    const [vx, vy] = toPx(d.victim_x, d.victim_y, cal, k2);
    const fade = 1 - dt / 48;
    ctx.globalAlpha = Math.min(0.6, 0.2 + d.dmg / 150) * fade;
    ctx.strokeStyle = TEAM_COLOR[teamOf[d.attacker]] || "#ccc";
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(vx, vy); ctx.stroke();
    ctx.globalAlpha = Math.min(0.7, 0.25 + d.dmg / 120) * fade;
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(vx, vy, 2.5, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
  }
  // vision cones under everything else player-related
  if (wallMask) {
    for (const p of replayData.players) {
      const dead = p.death_tick !== null && playTick >= p.death_tick;
      if (dead) continue;
      const info = posAt(p, playTick);
      if (!info) continue;
      const [rx, ry] = toPx(info.x, info.y, cal, k2);
      drawCone(ctx, clampPx(rx), clampPx(ry), info.yaw,
               CONE_WORLD / cal.scale * k2, TEAM_COLOR[p.team] || "#ccc");
    }
  }
  for (const k of replayData.kills) {
    if (k.tick > playTick) continue;
    const [vx, vy] = toPx(k.victim_x, k.victim_y, cal, k2);
    drawKillMark(ctx, clampPx(vx), clampPx(vy), k.headshot);
  }
  for (const p of replayData.players) {
    const dead = p.death_tick !== null && playTick >= p.death_tick;
    const info = posAt(p, Math.min(playTick, p.death_tick ?? playTick));
    if (!info) continue;
    const [rx, ry] = toPx(info.x, info.y, cal, k2);
    const x = clampPx(rx), y = clampPx(ry);
    ctx.globalAlpha = dead ? 0.25 : 1;
    ctx.fillStyle = TEAM_COLOR[p.team] || "#ccc";
    ctx.beginPath(); ctx.arc(x, y, 5, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
    if (!dead) drawTag(ctx, x, y, p.name, info.weapon, TEAM_COLOR[p.team] || "#ccc");
  }
  drawBomb(ctx, k2, cal);
  renderKillfeed();
  const secs = Math.max(0, (playTick - replayData.start) / TICK_RATE);
  $("clock").textContent = `${Math.floor(secs / 60)}:${String(Math.floor(secs % 60)).padStart(2, "0")}`;
  renderGearStrip();
}

function drawBomb(ctx, k2, cal) {
  // replay the bomb state machine: dropped -> pickup -> planted -> defused/exploded
  let st = null;
  for (const b of replayData.bombs || []) {
    if (b.tick > playTick) break;
    if (b.event === "bomb_dropped" && b.x !== null) st = { kind: "dropped", ...b };
    else if (b.event === "bomb_pickup") st = null;
    else if (b.event === "bomb_planted") st = { kind: "planted", ...b };
    else if (b.event === "bomb_defused") st = { kind: "defused", ...b };
    else if (b.event === "bomb_exploded") st = { kind: "exploded", ...b };
  }
  if (!st || st.x === null) return;
  if ((st.kind === "defused" || st.kind === "exploded") && playTick - st.tick > 3 * TICK_RATE) return;
  const [bx, by] = toPx(st.x, st.y, cal, k2);
  const x = clampPx(bx), y = clampPx(by);
  ctx.globalAlpha = st.kind === "planted" ? 0.6 + 0.4 * Math.sin(playTick / 6) : 1;
  const img = iconImg("c4");
  if (img) ctx.drawImage(img, x - 8, y - 8, 16, 16);
  else { ctx.fillStyle = "#ff5252"; ctx.beginPath(); ctx.arc(x, y, 6, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1;
  const label = { dropped: "C4 dropped", planted: "BOMB PLANTED",
                  defused: "DEFUSED", exploded: "BOMB DETONATED" }[st.kind];
  ctx.font = "bold 10px system-ui";
  const w = ctx.measureText(label).width;
  ctx.fillStyle = "rgba(13,17,23,.8)";
  ctx.beginPath(); ctx.roundRect(x - w / 2 - 4, y + 10, w + 8, 14, 3); ctx.fill();
  ctx.fillStyle = st.kind === "exploded" ? "#ff5252"
                : st.kind === "defused" ? "#4aa3ff" : "#f0a500";
  ctx.fillText(label, x - w / 2, y + 21);
}

let lastFeedSig = "";
function renderKillfeed() {
  // in-game style feed: recent kills top-right, kept for ~5s of game time
  const teams = {};
  for (const p of replayData.players) teams[p.name] = p.team;
  const shown = (replayData.kills || [])
    .filter(k => k.tick <= playTick && playTick - k.tick < 5 * TICK_RATE)
    .slice(-6);
  const sig = shown.map(k => k.tick).join(",");
  if (sig === lastFeedSig) return;
  lastFeedSig = sig;
  $("feed").innerHTML = shown.map(k => {
    const w = (k.weapon || "").toLowerCase();
    const slug = ICON_SLUGS.has(w) ? w
      : (w.includes("knife") || w.includes("bayonet") || w.includes("daggers") ? "knife" : null);
    const icon = slug ? `<img src="/static/icons/${slug}.svg">` : `[${k.weapon}]`;
    return `<div class="feed-row">
      <span style="color:${TEAM_COLOR[teams[k.attacker]] || "#ccc"}">${k.attacker}</span>
      ${icon}${k.headshot ? '<span class="hs">◉</span>' : ""}
      <span style="color:${TEAM_COLOR[teams[k.victim]] || "#ccc"}">${k.victim}</span>
    </div>`;
  }).join("");
}

// replay control — one rAF loop only, ever
let rafRunning = false;

function ensureLoop() {
  if (rafRunning) return;
  rafRunning = true;
  lastFrame = performance.now();
  requestAnimationFrame(tickReplay);
}

async function togglePlay() {
  if (replayData) {
    playing = !playing;
    $("play-btn").textContent = playing ? "⏸" : "▶ Replay";
    if (playing) ensureLoop();
    return;
  }
  overlay(true, "loading replay data...");
  try {
    const r = await fetch(`/api/matches/${demoId}/rounds/${curRound}/replay`);
    if (!r.ok) return;
    replayData = await r.json();
    replayData.players.forEach(p => p._i = 0);
    const tl = $("timeline");
    tl.min = replayData.start; tl.max = replayData.end; tl.disabled = false;
    $("speed").disabled = false;
    // kill tick markers above the slider
    const span = replayData.end - replayData.start || 1;
    $("timeline-marks").innerHTML = (replayData.kills || []).map(k =>
      `<div class="tk" style="left:${(k.tick - replayData.start) / span * 100}%"></div>`
    ).join("");
    playTick = replayData.start;
    loadRadarImage(replayData.image);
    playing = true;
    $("play-btn").textContent = "⏸";
    ensureLoop();
  } finally { overlay(false); }
}

function stopReplay() {
  replayData = null; playing = false;
  $("play-btn").textContent = "▶ Replay";
  $("timeline").disabled = true; $("speed").disabled = true;
  $("clock").textContent = "";
  $("gear-strip").innerHTML = "";
  $("feed").innerHTML = ""; lastFeedSig = "";
  $("timeline-marks").innerHTML = "";
}

function posAt(p, tick) {
  const f = p.frames;
  if (!f.length) return null;
  let i = p._i;
  if (f[i][0] > tick) { i = 0; }  // seeked backward
  while (i < f.length - 1 && f[i + 1][0] <= tick) i++;
  p._i = i;
  const a = f[i], b = f[i + 1] || a;
  const span = b[0] - a[0];
  const t = span > 0 ? Math.min(1, (tick - a[0]) / span) : 0;
  return { x: a[1] + (b[1] - a[1]) * t, y: a[2] + (b[2] - a[2]) * t,
           weapon: a[3] || "", yaw: a[4] ?? 0 };
}

function gearAt(p, tick) {
  let inv = [];
  for (const [t, items] of p.gear_changes) {
    if (t > tick) break;
    inv = items;
  }
  return inv;
}

let lastGearSig = "";
function renderGearStrip() {
  // DOM writes are expensive at 60fps — only update when content changes
  let sig = "";
  const cards = [];
  for (const p of replayData.players) {
    const dead = p.death_tick !== null && playTick >= p.death_tick;
    const info = posAt(p, Math.min(playTick, p.death_tick ?? playTick));
    const weapon = info ? info.weapon : "";
    const inv = gearAt(p, Math.min(playTick, p.death_tick ?? playTick));
    sig += `${p.name}|${weapon}|${inv.join(",")}|${dead};`;
    cards.push({ p, dead, weapon, inv });
  }
  if (sig === lastGearSig) return;
  lastGearSig = sig;
  $("gear-strip").innerHTML = cards.map(({ p, dead, weapon, inv }) =>
    `<div class="gear-card ${p.team === 2 ? "t" : "ct"}${dead ? " dead" : ""}">
      <div class="gname" style="color:${TEAM_COLOR[p.team] || "#ccc"}">${p.name}</div>
      <div class="gweapon">${weapon ? iconTag(weapon) : ""}</div>
      <div class="ginv">${inv.map(iconTag).join(" ")}</div>
    </div>`).join("");
}

function tickReplay(now) {
  if (!replayData) { rafRunning = false; return; }
  if (playing) {
    playTick += (now - lastFrame) / 1000 * TICK_RATE * speed;
    if (playTick >= replayData.end) {
      playTick = replayData.end; playing = false; $("play-btn").textContent = "▶ Replay";
    }
    $("timeline").value = playTick;
  }
  lastFrame = now;
  render();
  if (playing) requestAnimationFrame(tickReplay);
  else rafRunning = false;
}

// hover (static kill map only — replay uses permanent tags)
$("radar").addEventListener("mousemove", e => {
  if (replayData) return;
  const c = $("radar"), rect = c.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (c.width / rect.width);
  const my = (e.clientY - rect.top) * (c.height / rect.height);
  let best = null, bestD = 144; // 12px radius
  for (const h of hoverables) {
    const d = (h.x - mx) ** 2 + (h.y - my) ** 2;
    if (d < bestD) { best = h; bestD = d; }
  }
  const changed = best !== hover;
  hover = best;
  c.style.cursor = hover ? "pointer" : "default";
  if (changed) render();
});
$("radar").addEventListener("mouseleave", () => {
  hover = null;
  if (!replayData) render();
});

async function loadRound(n) {
  curRound = n;
  stopReplay();
  document.querySelectorAll(".rnd").forEach(el => el.classList.remove("active"));
  const btn = $("rnd-" + n); if (btn) btn.classList.add("active");
  const r = await fetch(`/api/matches/${demoId}/rounds/${n}/map`);
  if (!r.ok) { $("radar-empty").textContent = "no radar for this map"; $("radar").hidden = true; return; }
  mapData = await r.json();
  $("replay-bar").hidden = false;
  loadRadarImage(mapData.image);
}

async function send() {
  const q = $("q");
  if (!demoId || !q.value.trim()) return;
  const text = q.value; q.value = "";
  addMsg("user", text);
  const thinking = addMsg("bot", "", true);
  try {
    const r = await fetch(`/api/matches/${demoId}/chat`, {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ message: text, history }),
    });
    const j = await r.json();
    thinking.classList.remove("spin");
    if (r.ok) {
      thinking.textContent = j.reply;
      history.push({role: "user", content: text}, {role: "assistant", content: j.reply});
    } else {
      thinking.textContent = "Error: " + (j.detail || r.status);
    }
  } catch (e) {
    thinking.classList.remove("spin");
    thinking.textContent = "Error: " + e.message;
  }
}

function addMsg(role, text, loading = false) {
  const d = document.createElement("div");
  d.className = "msg " + role;
  if (loading) d.classList.add("spin"); else d.textContent = text;
  $("chatlog").appendChild(d);
  $("chatlog").scrollTop = $("chatlog").scrollHeight;
  return d;
}

refreshMatches();
</script>
</body>
