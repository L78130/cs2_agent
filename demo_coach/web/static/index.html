<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>demo_coach</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1c2330; --border: #2d333b;
    --text: #e6edf3; --dim: #8b949e; --accent: #f0a500;
    --t: #e8b23a; --ct: #4aa3ff; --red: #ff5252;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif; height: 100vh;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 1rem; padding: .6rem 1.2rem;
    border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h1 { font-size: 1.05rem; margin: 0; letter-spacing: .12em; font-weight: 600; }
  header h1 span { color: var(--accent); }
  main { flex: 1; display: flex; min-height: 0; }

  #sidebar {
    width: 220px; border-right: 1px solid var(--border); background: var(--panel);
    padding: 1rem; display: flex; flex-direction: column; gap: .8rem;
  }
  .btn {
    background: var(--accent); color: #111; border: none; border-radius: 6px;
    padding: .55rem 1rem; font-weight: 600; cursor: pointer; font-size: .9rem;
  }
  .btn:disabled { opacity: .5; cursor: default; }
  .match-item {
    padding: .6rem .7rem; border-radius: 6px; background: var(--panel2);
    border: 1px solid var(--border); cursor: pointer; font-size: .85rem;
  }
  .match-item.active { border-color: var(--accent); }
  .match-item .sub { color: var(--dim); font-size: .75rem; margin-top: .2rem; }

  .btn.alt { background: var(--panel2); color: var(--text); border: 1px solid var(--border); }
  #dl-panel { display: flex; flex-direction: column; gap: .5rem; font-size: .8rem; }
  #dl-panel select, #dl-panel input {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 5px; padding: .4rem .5rem; font-size: .78rem; width: 100%;
  }
  #dl-panel .btn.sm { padding: .35rem .6rem; font-size: .78rem; }
  #dl-list { display: flex; flex-direction: column; gap: .4rem; max-height: 38vh; overflow-y: auto; }
  .dl-item { background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; padding: .45rem .55rem; font-size: .75rem; }
  .dl-item .drow { display: flex; justify-content: space-between; align-items: center; gap: .4rem; }
  .dl-item .sub { color: var(--dim); font-size: .7rem; margin-top: .15rem; }
  .dl-item button {
    background: var(--accent); color: #111; border: none; border-radius: 4px;
    padding: .15rem .5rem; font-size: .72rem; cursor: pointer; white-space: nowrap;
  }
  .dl-item button:disabled { opacity: .4; cursor: default; }

  #center { flex: 1; display: flex; flex-direction: column; min-width: 0; padding: 1rem; }
  #rounds { display: flex; flex-wrap: wrap; gap: .3rem; margin-bottom: .8rem; min-height: 2rem; }
  .rnd {
    min-width: 2rem; padding: .25rem .4rem; text-align: center; border-radius: 5px;
    background: var(--panel2); border: 1px solid var(--border); cursor: pointer;
    font-size: .78rem; color: var(--dim);
  }
  .rnd.t { border-bottom: 3px solid var(--t); }
  .rnd.ct { border-bottom: 3px solid var(--ct); }
  .rnd.active { background: var(--accent); color: #111; font-weight: 700; }
  #radar-wrap {
    flex: 1; display: flex; align-items: center; justify-content: center;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    min-height: 0; position: relative; overflow: hidden;
  }
  #radar { max-width: 100%; max-height: 100%; border-radius: 8px; }
  #radar.replay-live { cursor: grab; }
  #radar-empty { color: var(--dim); font-size: .9rem; position: absolute; }
  #feed {
    position: absolute; top: 10px; right: 10px; display: flex;
    flex-direction: column; gap: 4px; align-items: flex-end; pointer-events: none;
    z-index: 3;
  }
  .feed-row {
    background: rgba(13,17,23,.85); border: 1px solid var(--border);
    border-radius: 4px; padding: 2px 8px; font-size: .78rem;
    display: flex; gap: .4rem; align-items: center;
  }
  .feed-row img { height: 12px; }
  .feed-row .hs { color: var(--red); font-weight: 700; }

  /* roster HUD panels overlaid on the radar during replay */
  .roster {
    position: absolute; top: 10px; bottom: 10px; width: 148px; z-index: 2;
    display: none; flex-direction: column; gap: 4px; pointer-events: none;
  }
  .roster.show { display: flex; }
  #roster-t { left: 10px; }
  #roster-ct { right: 10px; }
  .ros-row {
    background: rgba(13,17,23,.82); border: 1px solid var(--border);
    border-radius: 5px; padding: 3px 6px; font-size: .72rem;
  }
  .ros-row.t { border-left: 3px solid var(--t); }
  .ros-row.ct { border-right: 3px solid var(--ct); }
  .ros-row.dead { opacity: .38; }
  .ros-top { display: flex; justify-content: space-between; gap: 4px; align-items: center; }
  .ros-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ros-row .wicon { height: 13px; }
  .ros-hp { height: 4px; background: #30363d; border-radius: 2px; margin-top: 3px; overflow: hidden; }
  .ros-hp > div { height: 100%; border-radius: 2px; }
  .ros-sub { display: flex; justify-content: space-between; color: var(--dim); margin-top: 2px; }

  /* current-round info bar under the replay scene */
  #round-info {
    position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
    background: rgba(13,17,23,.85); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 14px; font-size: .8rem; z-index: 3;
    display: none; pointer-events: none; white-space: nowrap;
  }
  #round-info.show { display: block; }

  #right {
    width: 400px; border-left: 1px solid var(--border); background: var(--panel);
    display: flex; flex-direction: column;
  }
  #tabs { display: flex; border-bottom: 1px solid var(--border); }
  .tab {
    flex: 1; padding: .65rem; text-align: center; cursor: pointer; color: var(--dim);
    font-size: .85rem; border-bottom: 2px solid transparent;
  }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .pane { flex: 1; overflow-y: auto; padding: .8rem; display: none; min-height: 0; }
  .pane.active { display: flex; flex-direction: column; }

  table { border-collapse: collapse; width: 100%; font-size: .8rem; }
  th, td { padding: .35rem .4rem; text-align: right; border-bottom: 1px solid var(--border); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--dim); font-weight: 500; position: sticky; top: 0; background: var(--panel); }

  #chatlog { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: .6rem; }
  .msg { padding: .55rem .7rem; border-radius: 8px; font-size: .85rem; white-space: pre-wrap; line-height: 1.45; }
  .msg.user { background: #1f3a5f; align-self: flex-end; max-width: 90%; }
  .msg.bot { background: var(--panel2); align-self: flex-start; max-width: 95%; }
  #chatbar { display: flex; gap: .5rem; padding-top: .6rem; }
  #chatbar input {
    flex: 1; background: var(--panel2); border: 1px solid var(--border);
    border-radius: 6px; padding: .55rem .7rem; color: var(--text); font-size: .85rem;
  }
  #chatbar input:focus { outline: none; border-color: var(--accent); }
  /* permanent token-usage readout, top right of the header */
  #token-usage {
    margin-left: auto; font-size: .72rem; color: var(--dim);
    border: 1px solid var(--border); border-radius: 6px; padding: 2px 10px;
    white-space: nowrap;
  }

  #overlay {
    position: fixed; inset: 0; background: rgba(13,17,23,.85); display: none;
    align-items: center; justify-content: center; flex-direction: column;
    gap: 1rem; z-index: 10;
  }
  #overlay.show { display: flex; }
  .bar { width: 320px; height: 6px; background: var(--panel2); border-radius: 3px; overflow: hidden; }
  .bar > div {
    height: 100%; width: 40%; background: var(--accent); border-radius: 3px;
    animation: slide 1.1s ease-in-out infinite;
  }
  @keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
  .spin {
    display: inline-block; width: .9em; height: .9em; border: 2px solid var(--dim);
    border-top-color: var(--accent); border-radius: 50%; animation: rot .7s linear infinite;
  }
  @keyframes rot { to { transform: rotate(360deg); } }
  .hint { color: var(--dim); font-size: .85rem; }
  #replay-bar { display: flex; gap: .6rem; align-items: center; margin-bottom: .6rem; }
  #replay-bar .btn.sm { padding: .3rem .7rem; font-size: .8rem; }
  #timeline-wrap { flex: 1; position: relative; }
  #timeline { width: 100%; accent-color: var(--accent); }
  #timeline-marks {
    position: absolute; top: -5px; left: 0; right: 0; height: 5px; pointer-events: none;
  }
  .tk { position: absolute; width: 3px; height: 6px; border-radius: 2px; background: var(--red); }
  #speed {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 5px; padding: .25rem;
  }
  .wicon { height: 13px; vertical-align: -2px; }

  /* player cards (scoreboard pane): one column per team */
  .cards2 { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; align-content: start; }
  .team-col { display: flex; flex-direction: column; gap: .5rem; }
  .team-h { font-size: .8rem; font-weight: 700; letter-spacing: .12em; text-align: center; }
  .pcard {
    background: var(--panel2); border: 1px solid var(--border); border-radius: 8px;
    padding: .5rem .6rem; cursor: pointer;
  }
  .pcard:hover { border-color: var(--accent); }
  .pcard.sel { border-color: var(--accent); background: #21262f; }
  .pname {
    font-weight: 600; font-size: .85rem; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .pstat { color: var(--dim); font-size: .74rem; margin-top: .15rem; display: flex; justify-content: space-between; }
  .pstat b { color: var(--text); font-weight: 600; }
  .pactions { display: flex; gap: .4rem; margin-top: .45rem; }
  .pactions button {
    flex: 1; background: var(--panel); color: var(--text); cursor: pointer;
    border: 1px solid var(--border); border-radius: 5px; padding: .3rem .2rem; font-size: .72rem;
  }
  .pactions button:hover { border-color: var(--accent); color: var(--accent); }

  /* per-player round highlights on the round selector */
  .rnd { position: relative; }
  .rnd.pk2 { box-shadow: inset 0 0 0 2px rgba(240,165,0,.45); }
  .rnd.pk3 { box-shadow: inset 0 0 0 2px var(--accent); }
  .rnd.pkhl { background: #3a2f10; }
  .rnd .pk-badge {
    position: absolute; top: -6px; right: -4px; background: var(--accent);
    color: #111; border-radius: 7px; font-size: .62rem; font-weight: 700;
    padding: 0 4px; line-height: 13px; pointer-events: none;
  }
</style>
</head>
<body>
<header><h1>demo<span>_coach</span></h1><span class="hint" id="hdr-status"></span><span id="token-usage">token: 0</span></header>
<main>
  <div id="sidebar">
    <input type="file" id="file" accept=".dem" hidden>
    <button class="btn" id="upload-btn" onclick="document.getElementById('file').click()">Upload .dem</button>
    <button class="btn alt" onclick="document.getElementById('dl-panel').hidden = !document.getElementById('dl-panel').hidden">⬇ Download demos</button>
    <div id="dl-panel" hidden>
      <select id="dl-platform" onchange="dlPlatformChanged()">
        <option value="5e">5EPlay</option>
        <option value="pwa">Perfect World (PWA)</option>
        <option value="steam">Steam matchmaking</option>
      </select>
      <div id="dl-fields"></div>
      <div id="dl-share" hidden>
        <input id="dl-sharecode" placeholder="or paste a share code: CSGO-XXXX-...">
        <button class="btn sm" onclick="dlShareCode()">Download by code</button>
      </div>
      <button class="btn sm" onclick="dlList()">List recent matches</button>
      <div id="dl-list"></div>
      <span class="hint" style="font-size:.7rem">credentials are stored locally only (download_config.json, git-ignored)</span>
    </div>
    <div id="match-list"></div>
  </div>

  <div id="center">
    <div id="rounds"></div>
    <div id="replay-bar" hidden>
      <button class="btn sm" id="play-btn" onclick="togglePlay()">▶ Replay</button>
      <div id="timeline-wrap">
        <div id="timeline-marks"></div>
        <input type="range" id="timeline" min="0" max="100" value="0" step="any" disabled>
      </div>
      <select id="speed" disabled>
        <option value="0.5">0.5x</option>
        <option value="1" selected>1x</option>
        <option value="2">2x</option>
        <option value="4">4x</option>
      </select>
      <span id="clock" class="hint"></span>
    </div>
    <div id="radar-wrap">
      <canvas id="radar" width="1024" height="1024" hidden></canvas>
      <span id="radar-empty">upload a demo to see the 2D round map</span>
      <div class="roster" id="roster-t"></div>
      <div class="roster" id="roster-ct"></div>
      <div id="round-info"></div>
      <div id="feed"></div>
    </div>
  </div>

  <div id="right">
    <div id="tabs">
      <div class="tab active" data-pane="scoreboard">Scoreboard</div>
      <div class="tab" data-pane="chat">Chat</div>
    </div>
    <div class="pane active" id="pane-scoreboard"></div>
    <div class="pane" id="pane-chat">
      <div id="chatlog"></div>
      <div id="chatbar">
        <input id="q" placeholder="Ask about the match..." onkeydown="if(event.key==='Enter')send()">
        <button class="btn" onclick="send()">Send</button>
      </div>
    </div>
  </div>
</main>

<div id="overlay">
  <div class="bar"><div></div></div>
  <span class="hint" id="overlay-text">parsing demo...</span>
</div>

<script>
let demoId = null, history = [], matches = {}, curRound = 0, mapData = null;
let hoverables = [], hover = null, roundsLog = [];

const $ = id => document.getElementById(id);
const overlay = (show, text) => {
  $("overlay").classList.toggle("show", show);
  if (text) $("overlay-text").textContent = text;
};

document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
  document.querySelectorAll(".pane").forEach(x => x.classList.remove("active"));
  t.classList.add("active");
  $("pane-" + t.dataset.pane).classList.add("active");
});

$("file").onchange = () => upload();
$("speed").onchange = e => { setSpeed(parseFloat(e.target.value)); };
$("timeline").oninput = e => {
  if (!replay) return;
  seekTo(parseFloat(e.target.value));
};

async function upload() {
  const f = $("file").files[0];
  if (!f) return;
  overlay(true, "uploading & parsing demo... (cached demos load instantly)");
  try {
    const fd = new FormData(); fd.append("file", f);
    const r = await fetch("/api/upload", { method: "POST", body: fd });
    const j = await r.json();
    if (!r.ok) { overlay(false); alert(j.detail); return; }
    await refreshMatches(j.demo_id);
  } finally { overlay(false); $("file").value = ""; }
}

// ---- demo downloads (5E / PWA / Steam) ----
const DL_FIELDS = {
  "5e": [["userid", "5E userid (tail of your profile URL)"]],
  "pwa": [["steamid", "SteamID64"], ["access_token", "PWA access_token"]],
  "steam": [["api_key", "Steam Web API key"], ["steamid", "SteamID64"],
            ["steamidkey", "match sharing auth key"], ["knowncode", "one known share code"]],
};
let dlCreds = {};

function dlPlatformChanged() {
  const p = $("dl-platform").value;
  $("dl-share").hidden = p !== "steam";
  $("dl-fields").innerHTML = DL_FIELDS[p].map(([k, label]) =>
    `<input id="dl-${k}" placeholder="${label}" value="${(dlCreds[p] && dlCreds[p][k]) || ""}">`
  ).join("");
}

function dlReadCreds() {
  const creds = {};
  for (const [k] of DL_FIELDS[$("dl-platform").value])
    creds[k] = $(`dl-${k}`).value.trim();
  return creds;
}

async function dlList() {
  const platform = $("dl-platform").value;
  overlay(true, "fetching match list...");
  try {
    const r = await fetch("/api/download/list", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ platform, creds: dlReadCreds(), save: true }),
    });
    const j = await r.json();
    if (!r.ok) { alert(j.detail); return; }
    $("dl-list").innerHTML = j.map((m, i) => {
      const score = (m.teams || []).map(t => t.score ?? "?").join(" : ");
      return `<div class="dl-item">
        <div class="drow"><b>${m.map}</b>
          <button ${m.demo_available ? "" : "disabled"}
            onclick='dlFetch(${JSON.stringify(m.match_id)}, ${i})'>⬇ get</button></div>
        <div class="sub">${m.date}${score ? " · " + score : ""}${m.rounds ? " · " + m.rounds + " rounds" : ""}</div>
      </div>`;
    }).join("") || '<span class="hint">no matches found</span>';
    window._dlMatches = j;
  } finally { overlay(false); }
}

async function dlFetch(matchId, idx) {
  const platform = $("dl-platform").value;
  const match = (window._dlMatches || [])[idx];
  if (!match) return;
  overlay(true, "downloading & parsing demo... (first parse takes ~30s)");
  try {
    const r = await fetch("/api/download/fetch", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ platform, creds: dlReadCreds(), match, save: true }),
    });
    const j = await r.json();
    if (!r.ok) { overlay(false); alert(j.detail); return; }
    await refreshMatches(j.demo_id);
  } finally { overlay(false); }
}

async function dlShareCode() {
  const code = $("dl-sharecode").value.trim();
  if (!code) return;
  overlay(true, "resolving share code & downloading...");
  try {
    const r = await fetch("/api/download/sharecode", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ share_code: code }),
    });
    const j = await r.json();
    if (!r.ok) { overlay(false); alert(j.detail); return; }
    await refreshMatches(j.demo_id);
  } finally { overlay(false); }
}

fetch("/api/download/config").then(r => r.json()).then(c => {
  dlCreds = c; dlPlatformChanged();
}).catch(() => dlPlatformChanged());

async function refreshMatches(selectId) {
  const list = await (await fetch("/api/matches")).json();
  matches = Object.fromEntries(list.map(m => [m.demo_id, m]));
  $("match-list").innerHTML = "";
  for (const m of list) {
    const d = document.createElement("div");
    d.className = "match-item" + (m.demo_id === selectId ? " active" : "");
    d.innerHTML = `${m.map}<div class="sub">${m.rounds_played} rounds</div>`;
    d.onclick = () => selectMatch(m.demo_id);
    $("match-list").appendChild(d);
  }
  if (selectId) selectMatch(selectId);
}

async function toolQuery(id, name, args) {
  const r = await fetch(`/api/matches/${id}/tool/${name}`, {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify(args),
  });
  if (!r.ok) throw new Error((await r.json()).detail || r.status);
  return r.json();
}

async function selectMatch(id) {
  demoId = id; history = []; $("chatlog").innerHTML = "";
  for (const k in replayCache) delete replayCache[k];   // drop other demos' rounds
  tokenTotals = { prompt: 0, completion: 0, total: 0 };
  $("token-usage").textContent = "token: 0";
  const m = matches[id];
  $("hdr-status").textContent = `${m.map} — ${m.rounds_played} rounds`;
  overlay(true, "loading match data...");
  try {
    renderScoreboard(await toolQuery(id, "get_scoreboard", {}));
    renderRounds(m.rounds_played);
    await loadRound(0);
  } finally { overlay(false); }
}

function esc(s) {
  return String(s).replace(/[&<>"']/g,
    c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

let selPlayer = null, hlPlayer = null;

function renderScoreboard(rows) {
  selPlayer = null; hlPlayer = null;
  const pane = $("pane-scoreboard");
  const card = r => `
    <div class="pcard" data-name="${esc(r.name)}">
      <div class="pname" style="color:${TEAM_COLOR[r.team] || "var(--text)"}">${esc(r.name)}</div>
      <div class="pstat"><span>K / D / A</span><b>${r.kills} / ${r.deaths} / ${r.assists}</b></div>
      <div class="pstat"><span>ADR</span><b>${r.adr}</b><span>HS%</span><b>${r.hs_pct}</b></div>
      <div class="pstat"><span>KAST</span><b>${r.kast}%</b><span>1stK</span><b>${r.first_kills}</b></div>
      <div class="pstat"><span>道具伤/局</span><b>${r.util_dmg_r ?? 0}</b><span>闪助</span><b>${r.flash_assists ?? 0}</b></div>
      <div class="pactions" hidden>
        <button data-act="analyze">Analyze performance</button>
        <button data-act="rounds">Highlight rounds</button>
      </div>
    </div>`;
  // one column per team (side at the end of the match — teams swap at half-time)
  const t = rows.filter(r => r.team === 2), ct = rows.filter(r => r.team === 3);
  t.push(...rows.filter(r => r.team !== 2 && r.team !== 3));  // unknown side -> T column
  pane.innerHTML = `<div class="cards2">
    <div class="team-col"><div class="team-h" style="color:var(--t)">T</div>${t.map(card).join("")}</div>
    <div class="team-col"><div class="team-h" style="color:var(--ct)">CT</div>${ct.map(card).join("")}</div>
  </div>`;
  pane.querySelectorAll(".pcard").forEach(cardEl => {
    const name = cardEl.dataset.name;
    cardEl.addEventListener("click", e => {
      const act = e.target.dataset.act;
      if (act === "analyze") { analyzePlayer(name); return; }
      if (act === "rounds") { highlightPlayerRounds(name, cardEl); return; }
      // toggle the action row on card click
      const open = !cardEl.querySelector(".pactions").hidden;
      pane.querySelectorAll(".pactions").forEach(a => a.hidden = true);
      pane.querySelectorAll(".pcard").forEach(c => c.classList.remove("sel"));
      if (!open) {
        cardEl.querySelector(".pactions").hidden = false;
        cardEl.classList.add("sel");

// ---- shared radar rendering helpers ----

let radarImg = new Image(), radarImgReady = false;

const iconCache = {};
function iconImg(slug) {

function loadRadarImage(src) {

function radarCtx() {
  const c = $("radar");
  return [c, c.getContext("2d"), c.width / 1024];
}
function toPx(x, y, cal, k2) {
  return [(x - cal.pos_x) / cal.scale * k2, (cal.pos_y - y) / cal.scale * k2];
}
// keep markers fully inside the canvas — stale/off-map position samples
// would otherwise draw partial dots at the map edges
const clampPx = v => Math.min(Math.max(v, 8), 1016);
function drawKillMark(ctx, x, y, headshot) {
  ctx.strokeStyle = headshot ? "#ff5252" : "#f0a500"; ctx.lineWidth = 2.5;
  const s = 6;
  ctx.beginPath();
  ctx.moveTo(x - s, y - s); ctx.lineTo(x + s, y + s);
  ctx.moveTo(x + s, y - s); ctx.lineTo(x - s, y + s);
  ctx.stroke();
}
function drawHoverTooltip(ctx) {
  if (!hover) return;
  ctx.font = "13px system-ui";
  const w = ctx.measureText(hover.label).width + 12;
  const x = Math.min(Math.max(hover.x - w / 2, 2), 1024 - w - 2);
  const y = Math.max(hover.y - 26, 4);
  ctx.fillStyle = "rgba(13,17,23,.9)";
  ctx.strokeStyle = "#f0a500"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(x, y, w, 20, 4); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#e6edf3";
  ctx.fillText(hover.label, x + 6, y + 14);
}

// THE single paint entry point: static kill map, or a replay frame
function render() {
  if (!radarImgReady) return;
  const [c, ctx, k2] = radarCtx();
  c.hidden = false; $("radar-empty").style.display = "none";
  // clearRect first: the radar PNG has large transparent areas, and drawImage
  // only composites — without clearing, tags/markers on those pixels persist
  // as smudges from previous frames
  ctx.clearRect(0, 0, c.width, c.height);
  if (replay) drawReplayScene(ctx, k2); else drawStatic(ctx, k2);
}

function drawStatic(ctx, k2) {
  ctx.drawImage(radarImg, 0, 0, c_width(ctx), c_width(ctx));
  hoverables = [];
  for (const k of mapData.kills) {
    let [ax, ay] = toPx(k.attacker_x, k.attacker_y, mapData.calibration, k2);
    let [vx, vy] = toPx(k.victim_x, k.victim_y, mapData.calibration, k2);
    ax = clampPx(ax); ay = clampPx(ay); vx = clampPx(vx); vy = clampPx(vy);
    ctx.strokeStyle = "rgba(239,68,68,.8)"; ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(vx, vy); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = "#4aa3ff";
    ctx.beginPath(); ctx.arc(ax, ay, 4, 0, 7); ctx.fill();
    drawKillMark(ctx, vx, vy, k.headshot);
    hoverables.push({ x: ax, y: ay, label: k.attacker + " (attacker)" });
    hoverables.push({ x: vx, y: vy, label: k.victim + " — " + k.weapon + (k.headshot ? " ◉" : "") });
  }
  drawHoverTooltip(ctx);
}
function c_width(ctx) { return ctx.canvas ? ctx.canvas.width : 1024; }

// ============================================================================
// 2D REPLAY — ported from DrEAmSs59/CS2-insight-agent's replay module
// (frames + interpolation, camera, area effects, roster HUD), vanilla JS.
// ============================================================================
let replay = null;             // API payload for the current round
let playing = false, speed = 1;
let anchorSec = 0, anchorNow = 0;   // drift-free playback clock
let rafRunning = false;
let frameTicks = [];           // frame ticks for binary search
let killsEv = [], bombEv = [], grenadeEv = [];

const SHOT_LIFE = 0.22;        // seconds a shot tracer stays visible
const KILL_LIFE = 5.0;         // seconds a kill line stays visible
const FEED_LIFE = 7.0;         // seconds a killfeed row stays visible

// ---- playback clock (absolute-time based, like replayPlayback.js) ----
function nowSec() { return performance.now() / 1000; }
function playheadSec() {
  return playing ? Math.min(anchorSec + (nowSec() - anchorNow) * speed, durationSec())
                 : anchorSec;
}
function durationSec() {
  if (!replay || !replay.frames.length) return 0;
  return replay.frames[replay.frames.length - 1].time_sec;
}
function setSpeed(s) {
  seekTo(playheadSec());       // re-anchor at the current position
  speed = s;
}
function seekTo(sec) {
  anchorSec = Math.min(Math.max(sec, 0), durationSec());
  anchorNow = nowSec();
  render();
}
function currentTickFloat() { return replay.start_tick + playheadSec() * replay.tick_rate; }

// frame pair bracketing a tick, via binary search (frames are tick-sorted)
function framePair(tickF) {
  let lo = 0, hi = frameTicks.length - 1;
  while (lo < hi) {
    const mid = (lo + hi + 1) >> 1;
    if (frameTicks[mid] <= tickF) lo = mid; else hi = mid - 1;
  }
  const i = Math.max(0, Math.min(lo, frameTicks.length - 1));
  const j = Math.min(i + 1, frameTicks.length - 1);
  const a = replay.frames[i], b = replay.frames[j];
  const span = b.tick - a.tick;
  const t = span > 0 ? Math.min(1, Math.max(0, (tickF - a.tick) / span)) : 0;
  return [a, b, t, i];
}

function lerpAngle(a, b, t) {  // shortest-path yaw interpolation
  let d = (b - a) % 360;
  if (d > 180) d -= 360;
  if (d < -180) d += 360;
  return a + d * t;
}

// interpolate all players at a tick: x/y/z linear, yaw shortest-path,
// discrete props (hp, weapon, inventory, alive) switch at ratio >= 0.5
function samplePlayers(tickF) {
  const [a, b, t] = framePair(tickF);
  const bByName = {};
  for (const p of b.players) bByName[p.name] = p;
  const out = [];
  for (const pa of a.players) {
    const pb = bByName[pa.name];
    if (!pb || pb === pa) { out.push(pa); continue; }
    const ps = t >= 0.5 ? pb : pa;   // discrete props from the nearer frame
    out.push({
      ...ps,
      x: pa.x + (pb.x - pa.x) * t,
      y: pa.y + (pb.y - pa.y) * t,
      z: pa.z + (pb.z - pa.z) * t,
      yaw: lerpAngle(pa.yaw, pb.yaw, t),
      is_alive: t >= 0.5 ? pb.is_alive : pa.is_alive,
    });
  }
  return out;
}

// shots fired within SHOT_LIFE before the playhead, walked back from the
// current frame (shots are attached to their nearest frame)
function recentShots(tickF, frameIdx) {
  const out = [];
  const minTick = tickF - SHOT_LIFE * replay.tick_rate;
  for (let i = frameIdx; i >= 0 && frameTicks[i] >= minTick; i--) {
    for (const s of replay.frames[i].shots) {
      if (s.tick <= tickF && s.tick >= minTick) out.push(s);
    }
  }
  return out;
}

// ---- camera (fit / wheel zoom at cursor / drag pan / double-click reset) ----
const cam = { x: 512, y: 512, zoom: 1 };  // scene-point at canvas center; 1 = fit
const CAM_MIN = 0.6, CAM_MAX = 3, CAM_STEP = 1.15;

function contentBox() {
  const m = replay && replay.map_transform || {};
  return (m.content_width > 0)
    ? [m.content_x, m.content_y, m.content_width, m.content_height]
    : [0, 0, 1024, 1024];
}
function fitScale() {
  const [,, w, h] = contentBox();
  return Math.min(1024 / w, 1024 / h) * 0.88;  // contain-fit, 88% cover
}
function cameraFit() {
  const [cx, cy, w, h] = contentBox();
  cam.x = cx + w / 2; cam.y = cy + h / 2; cam.zoom = 1;
  if (replay) render();
}
function clampCam() {
  cam.x = Math.min(Math.max(cam.x, -256), 1280);
  cam.y = Math.min(Math.max(cam.y, -256), 1280);
}
function camTransform(ctx, k2) {
  const s = fitScale() * cam.zoom * k2;
  ctx.setTransform(s, 0, 0, s, (512 - cam.x * fitScale() * cam.zoom) * k2,
                   (512 - cam.y * fitScale() * cam.zoom) * k2);
  return fitScale() * cam.zoom;  // scene px -> 1024-canvas px scale
}
$("radar").addEventListener("wheel", e => {
  if (!replay) return;
  e.preventDefault();
  const rect = e.target.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (1024 / rect.width);
  const my = (e.clientY - rect.top) * (1024 / rect.height);
  const oldS = fitScale() * cam.zoom;
  cam.zoom = Math.min(Math.max(cam.zoom * Math.pow(CAM_STEP, -e.deltaY / 100), CAM_MIN), CAM_MAX);
  const newS = fitScale() * cam.zoom;
  // keep the scene point under the cursor fixed
  cam.x += (mx - 512) * (1 / oldS - 1 / newS);
  cam.y += (my - 512) * (1 / oldS - 1 / newS);
  clampCam();
  render();
}, { passive: false });
let dragFrom = null;
$("radar").addEventListener("mousedown", e => {
  if (!replay) return;
  dragFrom = { x: e.clientX, y: e.clientY };
  e.target.style.cursor = "grabbing";
});
window.addEventListener("mousemove", e => {
  if (!dragFrom || !replay) return;
  const rect = $("radar").getBoundingClientRect();
  const s = fitScale() * cam.zoom * (rect.width / 1024);
  cam.x -= (e.clientX - dragFrom.x) / s;
  cam.y -= (e.clientY - dragFrom.y) / s;
  dragFrom = { x: e.clientX, y: e.clientY };
  clampCam();
  render();
});
window.addEventListener("mouseup", () => {
  dragFrom = null;
  if (replay) $("radar").style.cursor = "grab";
});
$("radar").addEventListener("dblclick", () => { if (replay) cameraFit(); });

// ---- area effects: smokes / infernos drawn on a layer canvas, clipped to
// the map's utility mask (luminance -> alpha) so they bleed around walls ----
let maskCanvas = null, maskForMap = null;
const fxCanvas = document.createElement("canvas");
fxCanvas.width = fxCanvas.height = 1024;

function loadMask(src) {
  maskCanvas = null; maskForMap = null;
  if (!src) return;
  const img = new Image();
  img.onload = () => {
    if (img.naturalWidth < 256) return;   // not a real mask (test harness)
    const off = document.createElement("canvas");
    off.width = off.height = 1024;
    const c2 = off.getContext("2d");
    c2.drawImage(img, 0, 0, 1024, 1024);
    const d = c2.getImageData(0, 0, 1024, 1024);
    const px = d.data;
    for (let i = 0; i < px.length; i += 4) {
      px[i + 3] = (px[i] + px[i + 1] + px[i + 2]) / 3;  // luminance -> alpha
    }
    c2.putImageData(d, 0, 0);
    maskCanvas = off;
  };
  img.src = src;
}

function drawEffects(cal, tickF) {
  const fx = fxCanvas.getContext("2d");
  fx.setTransform(1, 0, 0, 1, 0, 0);
  fx.clearRect(0, 0, 1024, 1024);
  let any = false;

  for (const tr of replay.effect_tracks || []) {
    if (tickF < tr.start_tick || tickF > tr.end_tick) continue;
    any = true;
    const [px, py] = toPx(tr.x, tr.y, cal, 1);
    const r = tr.radius / cal.scale;
    const age = (tickF - tr.start_tick) / replay.tick_rate;
    const left = (tr.end_tick - tickF) / replay.tick_rate;
    if (tr.type === "smoke") {
      const grow = Math.min(1, age / 1.2);          // cloud forms over ~1.2s
      const fade = Math.min(1, left / 2);           // disperses over last 2s
      const rr = r * (0.4 + 0.6 * grow);
      const g = fx.createRadialGradient(px, py, rr * 0.2, px, py, rr);
      g.addColorStop(0, `rgba(205,210,218,${0.85 * fade})`);
      g.addColorStop(0.75, `rgba(190,196,205,${0.7 * fade})`);
      g.addColorStop(1, "rgba(190,196,205,0)");
      fx.fillStyle = g;
      fx.beginPath(); fx.arc(px, py, rr, 0, 7); fx.fill();
    } else {  // inferno
      const fade = Math.min(1, left / 1);
      const flick = 1 + 0.07 * Math.sin(tickF / 2.7);
      const g = fx.createRadialGradient(px, py, 0, px, py, r * flick);
      g.addColorStop(0, `rgba(255,196,66,${0.85 * fade})`);
      g.addColorStop(0.55, `rgba(255,110,30,${0.65 * fade})`);
      g.addColorStop(1, "rgba(200,40,10,0)");
      fx.fillStyle = g;
      fx.beginPath(); fx.arc(px, py, r * flick, 0, 7); fx.fill();
    }
  }
  // transient bursts: HE ring + flash bloom from grenade events
  for (const g of grenadeEv) {
    const age = (tickF - g.tick) / replay.tick_rate;
    if (age < 0 || g.x === null) continue;
    const [px, py] = toPx(g.x, g.y, cal, 1);
    if (g.kind === "he" && age < 0.6) {
      any = true;
      const rr = age * 350 / cal.scale;
      fx.globalAlpha = 1 - age / 0.6;
      fx.strokeStyle = "#ffb74d"; fx.lineWidth = 3;
      fx.beginPath(); fx.arc(px, py, rr, 0, 7); fx.stroke();
      fx.fillStyle = "rgba(255,150,50,.45)";
      fx.beginPath(); fx.arc(px, py, rr * 0.6, 0, 7); fx.fill();
      fx.globalAlpha = 1;
    } else if (g.kind === "flash" && age < 0.4) {
      any = true;
      const gg = fx.createRadialGradient(px, py, 0, px, py, 90 / cal.scale);
      gg.addColorStop(0, `rgba(255,255,255,${0.95 * (1 - age / 0.4)})`);
      gg.addColorStop(1, "rgba(255,255,255,0)");
      fx.fillStyle = gg;
      fx.beginPath(); fx.arc(px, py, 90 / cal.scale, 0, 7); fx.fill();
    }
  }
  if (!any) return false;
  if (maskCanvas) {
    fx.globalCompositeOperation = "destination-in";
    fx.drawImage(maskCanvas, 0, 0);
    fx.globalCompositeOperation = "source-over";
  }
  return true;
}

// ---- bomb state machine at the playhead (dropped -> pickup -> planted ->
// defused/exploded), like the reference ReplayBombMarker ----
function bombStateAt(tickF) {
  let st = null;
  for (const b of bombEv) {
    if (b.tick > tickF) break;
    if (b.type === "bomb_drop" && b.x !== null) st = { kind: "dropped", ...b };
    else if (b.type === "bomb_pickup") st = null;
    else if (b.type === "plant") st = { kind: "planted", ...b };
    else if (b.type === "defuse") st = { kind: "defused", ...b };
    else if (b.type === "explode") st = { kind: "exploded", ...b };
  }
  if (st && (st.kind === "defused" || st.kind === "exploded")
      && tickF - st.tick > 3 * replay.tick_rate) return null;
  return st;
}

function drawBomb(ctx, cal) {
  const st = bombStateAt(currentTickFloat());
  if (!st || st.x === null) return;
  const [bx, by] = toPx(st.x, st.y, cal, 1);
  const x = clampPx(bx), y = clampPx(by);
  ctx.globalAlpha = st.kind === "planted" ? 0.6 + 0.4 * Math.sin(currentTickFloat() / 6) : 1;
  const img = iconImg("c4");
  if (img) ctx.drawImage(img, x - 8, y - 8, 16, 16);
  else { ctx.fillStyle = "#ff5252"; ctx.beginPath(); ctx.arc(x, y, 6, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1;
  const label = { dropped: "C4 dropped", planted: "BOMB PLANTED",
                  defused: "DEFUSED", exploded: "BOMB DETONATED" }[st.kind];
  ctx.font = "bold 10px system-ui";
  const w = ctx.measureText(label).width;
  ctx.fillStyle = "rgba(13,17,23,.8)";
  ctx.beginPath(); ctx.roundRect(x - w / 2 - 4, y + 10, w + 8, 14, 3); ctx.fill();
  ctx.fillStyle = st.kind === "exploded" ? "#ff5252"
                : st.kind === "defused" ? "#4aa3ff" : "#f0a500";
  ctx.fillText(label, x - w / 2, y + 21);
}

// grenade flight markers: interpolate along the recorded trajectory between
// throw and detonation
const NADE_COLOR = { smoke: "#cfd3da", flash: "#ffffff", he: "#ffb74d",
                     molotov: "#ff7a30", incendiary: "#ff7a30", decoy: "#e6e36a" };
function drawGrenadeFlights(ctx, cal, tickF) {
  for (const g of grenadeEv) {
    const traj = g.trajectory || [];
    if (g.throw_tick === null || traj.length < 2) continue;
    if (tickF < g.throw_tick || tickF >= g.tick) continue;
    let i = 0;
    while (i < traj.length - 2 && traj[i + 1].tick <= tickF) i++;
    const a = traj[i], b = traj[i + 1];
    const t = b.tick > a.tick ? (tickF - a.tick) / (b.tick - a.tick) : 0;
    const gx = a.x + (b.x - a.x) * t, gy = a.y + (b.y - a.y) * t;
    const [px, py] = toPx(gx, gy, cal, 1);
    ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.lineWidth = 1;
    ctx.setLineDash([3, 4]);
    ctx.beginPath();
    let started = false;
    for (const p of traj) {
      if (p.tick > tickF) break;
      const [qx, qy] = toPx(p.x, p.y, cal, 1);
      if (started) ctx.lineTo(qx, qy); else { ctx.moveTo(qx, qy); started = true; }
    }
    ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = NADE_COLOR[g.kind] || "#fff";
    ctx.beginPath(); ctx.arc(clampPx(px), clampPx(py), 3.5, 0, 7); ctx.fill();
  }
}

function drawPlayers(ctx, cal, players) {
  for (const p of players) {
    if (!p.is_alive) continue;   // dead players leave the scene (kill X covers it)
    const [rx, ry] = toPx(p.x, p.y, cal, 1);
    const x = clampPx(rx), y = clampPx(ry);
    const color = TEAM_COLOR[p.team] || "#ccc";
    // flashed: white wash proportional to remaining flash time
    if (p.flash_duration > 0.3) {
      ctx.globalAlpha = Math.min(0.85, p.flash_duration / 2.5);
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(x, y, 9, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
    }
    // body + yaw arrow (CS2 yaw -> canvas angle: y axis is flipped on radar)
    ctx.fillStyle = color;
    ctx.strokeStyle = "rgba(0,0,0,.6)"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(x, y, 6, 0, 7); ctx.fill(); ctx.stroke();
    const rad = -p.yaw * Math.PI / 180;
    ctx.strokeStyle = color; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(rad) * 12, y + Math.sin(rad) * 12); ctx.stroke();
    // hp ring, green -> red
    const frac = Math.max(0, Math.min(1, p.health / 100));
    ctx.strokeStyle = frac > 0.5 ? "#7ee787" : frac > 0.25 ? "#f0a500" : "#ff5252";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x, y, 8.5, -Math.PI / 2, -Math.PI / 2 + frac * 2 * Math.PI);
    ctx.stroke();
    // c4 / defuser badges
    if (p.has_c4) {
      const img = iconImg("c4");
      if (img) ctx.drawImage(img, x + 7, y - 13, 10, 10);
    } else if (p.has_defuser) {
      const img = iconImg("defuser");
      if (img) ctx.drawImage(img, x + 7, y - 13, 10, 10);
    }
    // name + active weapon
    ctx.font = "bold 10px system-ui";
    const w = ctx.measureText(p.name).width;
    const bx = Math.min(Math.max(x - w / 2 - 3, 2), 1024 - w - 8);
    const by = Math.max(y - 30, 2);
    ctx.fillStyle = "rgba(13,17,23,.72)";
    ctx.beginPath(); ctx.roundRect(bx, by, w + 6, 13, 3); ctx.fill();
    ctx.fillStyle = color;
    ctx.fillText(p.name, bx + 3, by + 10);
    const wimg = p.weapon && WEAPON_ICON[p.weapon] ? iconImg(WEAPON_ICON[p.weapon]) : null;
    if (wimg) {
      const iw = wimg.naturalWidth / wimg.naturalHeight * 11;
      ctx.drawImage(wimg, x - iw / 2, y + 10, iw, 11);
    }
  }
}

function drawReplayScene(ctx, k2) {
  const cal = replay.map_transform;
  const tickF = currentTickFloat();
  const frameIdx = framePair(tickF)[3];
  const players = samplePlayers(tickF);

  ctx.save();
  camTransform(ctx, k2);
  ctx.drawImage(radarImg, 0, 0, 1024, 1024);

  if (drawEffects(cal, tickF)) ctx.drawImage(fxCanvas, 0, 0);
  drawGrenadeFlights(ctx, cal, tickF);

  // shot tracers: short rays along the shooter's yaw, fading fast
  // (CS2 demos do not record bullet impact points, so this is approximate)
  for (const s of recentShots(tickF, frameIdx)) {
    if (s.x === null) continue;
    const age = (tickF - s.tick) / replay.tick_rate;
    const [sx, sy] = toPx(s.x, s.y, cal, 1);
    const rad = -s.yaw * Math.PI / 180;
    const len = 400 / cal.scale;  // ~400 world units, like cs2-demo-viewer
    ctx.globalAlpha = 0.6 * (1 - age / SHOT_LIFE);
    ctx.strokeStyle = "#ffd97a"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(sx, sy);
    ctx.lineTo(sx + Math.cos(rad) * len, sy + Math.sin(rad) * len);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // kill lines: dashed attacker -> victim + X at the victim, fading over 5s
  const teamOf = {};
  for (const p of replay.frames[0].players) teamOf[p.name] = p.team;
  for (const k of killsEv) {
    if (k.tick > tickF) continue;
    const age = (tickF - k.tick) / replay.tick_rate;
    if (age > KILL_LIFE) continue;
    const fade = 1 - age / KILL_LIFE;
    if (k.actor_x !== null && k.target_x !== null) {
      const [ax, ay] = toPx(k.actor_x, k.actor_y, cal, 1);
      const [vx, vy] = toPx(k.target_x, k.target_y, cal, 1);
      ctx.globalAlpha = 0.75 * fade;
      ctx.strokeStyle = TEAM_COLOR[teamOf[k.actor]] || "#ef4444";
      ctx.lineWidth = 1.5;
      ctx.setLineDash([6, 4]);
      ctx.beginPath(); ctx.moveTo(clampPx(ax), clampPx(ay));
      ctx.lineTo(clampPx(vx), clampPx(vy)); ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
    }
    if (k.target_x !== null) {
      const [vx, vy] = toPx(k.target_x, k.target_y, cal, 1);
      ctx.globalAlpha = Math.max(0.35, fade);
      drawKillMark(ctx, clampPx(vx), clampPx(vy), k.headshot);
      ctx.globalAlpha = 1;
    }
  }

  drawBomb(ctx, cal);
  drawPlayers(ctx, cal, players);
  ctx.restore();

  renderKillfeed(tickF, teamOf);
  renderRoster(players);
  const sec = playheadSec();
  $("clock").textContent =
    `${Math.floor(sec / 60)}:${String(Math.floor(sec % 60)).padStart(2, "0")} / ` +
    `${Math.floor(durationSec() / 60)}:${String(Math.floor(durationSec() % 60)).padStart(2, "0")}`;
}

let lastFeedSig = "";
function renderKillfeed(tickF, teamOf) {
  // in-game style feed: recent kills top-right, kept for ~7s of game time
  const shown = killsEv
    .filter(k => k.tick <= tickF && (tickF - k.tick) < FEED_LIFE * replay.tick_rate)
    .slice(-5);
  const sig = shown.map(k => k.tick).join(",");
  if (sig === lastFeedSig) return;
  lastFeedSig = sig;
  $("feed").innerHTML = shown.map(k => {
    const w = (k.weapon || "").toLowerCase();
    const slug = ICON_SLUGS.has(w) ? w
      : (w.includes("knife") || w.includes("bayonet") || w.includes("daggers") ? "knife" : null);
    const icon = slug ? `<img src="/static/icons/${slug}.svg">` : `[${k.weapon}]`;
    return `<div class="feed-row">
      <span style="color:${TEAM_COLOR[teamOf[k.actor]] || "#ccc"}">${k.actor || "world"}</span>
      ${icon}${k.headshot ? '<span class="hs">◉</span>' : ""}
      <span style="color:${TEAM_COLOR[teamOf[k.target]] || "#ccc"}">${k.target}</span>
    </div>`;
  }).join("");
}

// ---- roster HUD: one card per player per team, hp bar + weapon + money ----
let rosterOrder = [], lastRosterSig = "";
function buildRoster() {
  rosterOrder = [...replay.frames[0].players]
    .sort((a, b) => (a.team > b.team ? 1 : -1) || (a.name > b.name ? 1 : -1));
  lastRosterSig = "";
  $("roster-t").classList.add("show");
  $("roster-ct").classList.add("show");
}
function renderRoster(players) {
  const byName = {};
  for (const p of players) byName[p.name] = p;
  const state = rosterOrder.map(p => byName[p.name] || p);
  const sig = state.map(p =>
    `${p.name}|${p.health}|${p.weapon}|${p.money}|${p.armor}|${p.is_alive}`).join(";");
  if (sig === lastRosterSig) return;   // DOM writes are expensive at 60fps
  lastRosterSig = sig;
  for (const team of ["T", "CT"]) {
    $("roster-" + team.toLowerCase()).innerHTML = state
      .filter(p => p.team === team)
      .map(p => {
        const hp = Math.max(0, p.health);
        const hpColor = hp > 50 ? "#7ee787" : hp > 25 ? "#f0a500" : "#ff5252";
        return `<div class="ros-row ${team.toLowerCase()}${p.is_alive ? "" : " dead"}">
          <div class="ros-top">
            <span class="ros-name" style="color:${TEAM_COLOR[team]}">${p.name}</span>
            <span>${p.weapon ? (WEAPON_ICON[p.weapon]
              ? `<img class="wicon" src="/static/icons/${WEAPON_ICON[p.weapon]}.svg">` : "") : ""}</span>
          </div>
          <div class="ros-hp"><div style="width:${hp}%;background:${hpColor}"></div></div>
          <div class="ros-sub"><span>${p.is_alive ? hp + " hp" : "dead"}</span><span>$${p.money}</span></div>
        </div>`;
      }).join("");
  }
}

// ---- replay loading & the single rAF loop ----
const replayCache = {};   // "demoId:round" -> payload; server rounds are disk-cached

async function loadReplayFor(n) {
  const key = demoId + ":" + n;
  if (!replayCache[key]) {
    overlay(true, "loading replay data... (first build parses the whole demo)");
    try {
      const r = await fetch(`/api/matches/${demoId}/rounds/${n}/replay`);
      const j = await r.json();
      if (!r.ok) { overlay(false); alert(j.detail || r.status); return false; }
      replayCache[key] = j;
    } finally { overlay(false); }
  }
  replay = replayCache[key];
  if (!replay.frames || !replay.frames.length) {
    replay = null; alert("no replay data for this round"); return false;
  }
  initReplay();
  prefetchAround(n);
  return true;
}

// fetch the neighbouring rounds in the background so switching is instant
function prefetchAround(n) {
  const total = matches[demoId] ? matches[demoId].rounds_played : 0;
  for (const m of [n + 1, n - 1]) {
    const key = demoId + ":" + m;
    if (m < 0 || m >= total || replayCache[key]) continue;
    fetch(`/api/matches/${demoId}/rounds/${m}/replay`)
      .then(r => r.ok ? r.json() : null)
      .then(j => { if (j && j.frames && j.frames.length) replayCache[key] = j; })
      .catch(() => {});
  }
}

async function togglePlay() {
  if (replay) {
    setPlaying(!playing);
    return;
  }
  if (await loadReplayFor(curRound)) setPlaying(true);
}

function initReplay() {
  frameTicks = replay.frames.map(f => f.tick);
  killsEv = replay.events.filter(e => e.type === "kill");
  bombEv = replay.events.filter(e => e.type !== "kill" && e.type !== "grenade");
  grenadeEv = replay.events.filter(e => e.type === "grenade");
  const tl = $("timeline");
  tl.min = 0; tl.max = durationSec(); tl.value = 0; tl.disabled = false;
  $("speed").disabled = false;
  const span = durationSec() || 1;
  $("timeline-marks").innerHTML = killsEv.map(k =>
    `<div class="tk" style="left:${(k.tick - replay.start_tick) / replay.tick_rate / span * 100}%"></div>`
  ).join("");
  $("radar").classList.add("replay-live");
  $("radar").style.cursor = "grab";
  $("round-info").classList.add("show");
  loadRadarImage(replay.image);
  loadMask(replay.mask);
  cameraFit();
  buildRoster();
  renderRoundInfo();
  seekTo(0);
}

// current-round info bar under the scene: winner, end reason, buys
function renderRoundInfo() {
  const r = roundsLog[curRound];
  if (!r) return;
  const wc = r.winner_side === "T" ? "var(--t)" : "var(--ct)";
  $("round-info").innerHTML =
    `<b>Round ${curRound + 1}</b> · <span style="color:${wc}">${r.winner_side}</span> won` +
    ` · ${r.reason_text} · T buy: ${r.t_buy} · CT buy: ${r.ct_buy}`;
}

function setPlaying(on) {
  if (on && playheadSec() >= durationSec() - 0.01) seekTo(0);  // replay ended -> restart
  if (on) seekTo(playheadSec());   // re-anchor before resuming
  playing = on;
  $("play-btn").textContent = on ? "⏸" : "▶ Replay";
  if (on) ensureLoop();
}

function stopReplay() {
  replay = null; playing = false;
  $("play-btn").textContent = "▶ Replay";
  $("timeline").disabled = true; $("speed").disabled = true;
  $("clock").textContent = "";
  $("feed").innerHTML = ""; lastFeedSig = "";
  $("timeline-marks").innerHTML = "";
  $("roster-t").classList.remove("show");
  $("roster-ct").classList.remove("show");
  $("round-info").classList.remove("show");
  $("radar").classList.remove("replay-live");
  $("radar").style.cursor = "default";
  maskCanvas = null; maskForMap = null;
}

function ensureLoop() {
  if (rafRunning) return;
  rafRunning = true;
  requestAnimationFrame(tickReplay);
}

function tickReplay() {
  if (!replay) { rafRunning = false; return; }
  if (playing) {
    const sec = playheadSec();
    $("timeline").value = sec;
    if (sec >= durationSec()) setPlaying(false);
  }
  render();
  if (playing) requestAnimationFrame(tickReplay);
  else rafRunning = false;
}

// hover (static kill map only — replay uses permanent tags)
$("radar").addEventListener("mousemove", e => {
  if (replay) return;
  const c = $("radar"), rect = c.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (c.width / rect.width);
  const my = (e.clientY - rect.top) * (c.height / rect.height);
  let best = null, bestD = 144; // 12px radius
  for (const h of hoverables) {
    const d = (h.x - mx) ** 2 + (h.y - my) ** 2;
    if (d < bestD) { best = h; bestD = d; }
  }
  const changed = best !== hover;
  hover = best;
  c.style.cursor = hover ? "pointer" : "default";
  if (changed) render();
});
$("radar").addEventListener("mouseleave", () => {
  hover = null;
  if (!replay) render();
});

async function loadRound(n) {
  const wasReplay = !!replay;   // keep replaying when switching rounds mid-replay
  curRound = n;
  stopReplay();
  document.querySelectorAll(".rnd").forEach(el => el.classList.remove("active"));
  const btn = $("rnd-" + n); if (btn) btn.classList.add("active");
  const r = await fetch(`/api/matches/${demoId}/rounds/${n}/map`);
  if (!r.ok) { $("radar-empty").textContent = "no radar for this map"; $("radar").hidden = true; return; }
  mapData = await r.json();
  $("replay-bar").hidden = false;
  loadRadarImage(mapData.image);
  if (wasReplay && await loadReplayFor(n)) setPlaying(true);
}

async function send() {
  const q = $("q");
  if (!demoId || !q.value.trim()) return;
  const text = q.value; q.value = "";
  addMsg("user", text);
  const thinking = addMsg("bot", "", true);
  let reply = "", ok = false;
  try {
    const r = await fetch(`/api/matches/${demoId}/chat/stream`, {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ message: text, history }),
    });
    if (!r.ok) {
      const j = await r.json().catch(() => ({}));
      reply = "Error: " + (j.detail || r.status);
    } else {
      ok = true;
      // SSE over fetch: read "data: {...}\n\n" events as they arrive
      const reader = r.body.getReader();
      const dec = new TextDecoder();
      let buf = "";
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let i;
        while ((i = buf.indexOf("\n\n")) >= 0) {
          const line = buf.slice(0, i).trim(); buf = buf.slice(i + 2);
          if (!line.startsWith("data:")) continue;
          const ev = JSON.parse(line.slice(5));
          if (ev.type === "token") {
            reply += ev.text;
            thinking.classList.remove("spin");
            thinking.textContent = reply;
            $("chatlog").scrollTop = $("chatlog").scrollHeight;
          } else if (ev.type === "tool") {
            thinking.classList.remove("spin");
            thinking.textContent = reply + (reply ? "\n" : "") + `⚙ ${ev.name}...`;
          } else if (ev.type === "done") {
            reply = ev.reply || reply;
            if (ev.usage) addTokenUsage(ev.usage);
          } else if (ev.type === "error") {
            reply = "Error: " + ev.detail; ok = false;
          }
        }
      }
    }
  } catch (e) {
    reply = "Error: " + e.message; ok = false;
  }
  thinking.classList.remove("spin");
  thinking.textContent = reply;
  if (ok && reply)
    history.push({role: "user", content: text}, {role: "assistant", content: reply});
}

function addMsg(role, text, loading = false) {
  const d = document.createElement("div");
  d.className = "msg " + role;
  if (loading) d.classList.add("spin"); else d.textContent = text;
  $("chatlog").appendChild(d);
  $("chatlog").scrollTop = $("chatlog").scrollHeight;
  return d;
}

// token usage bookkeeping: per-message from the API, cumulative per demo
let tokenTotals = { prompt: 0, completion: 0, total: 0 };
function addTokenUsage(u) {
  for (const k of ["prompt", "completion", "total"]) tokenTotals[k] += u[k] || 0;
  const est = u.estimated ? "约" : "";
  $("token-usage").textContent =
    `本次${est} ${u.total.toLocaleString()} tok (输入 ${u.prompt.toLocaleString()} / 输出 ${u.completion.toLocaleString()})` +
    ` · 本场${est}合计 ${tokenTotals.total.toLocaleString()} tok`;
}

refreshMatches();
</script>
